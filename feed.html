<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your feed — PACR</title>
<meta name="description" content="Sign in to see your squad's runs on PACR." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://pacr.life/feed" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/brand-acid/favicon.png" />
<link rel="apple-touch-icon" href="/brand-acid/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; color:#0F0F0D; font-family:Manrope, sans-serif; }
  * { box-sizing: border-box; }
  a { color:#5A6B00; text-decoration:none; }
  a:hover { color:#0F0F0D; }
  ::selection { background:#E8FF3A; color:#0A0A09; }
  img { -webkit-user-drag:none; max-width:100%; }
  [hidden] { display:none !important; }

  .pad-x { padding-left:40px; padding-right:40px; }
  @media (max-width:760px) { .pad-x { padding-left:22px; padding-right:22px; } }

  .eyebrow { font-family:Manrope, sans-serif; font-weight:600; font-size:11px; letter-spacing:0.2em;
             text-transform:uppercase; color:#5A6B00; margin-bottom:18px; display:flex; align-items:center; gap:10px; }
  .eyebrow::before { content:''; display:block; width:24px; height:2px; background:#A8BC00; }

  h1.disp { font-family:Outfit, sans-serif; font-weight:700; font-size:clamp(34px,4.4vw,52px);
            line-height:0.96; letter-spacing:-0.02em; text-transform:uppercase; margin:0 0 18px; }

  .lede { font-size:17px; line-height:1.6; color:#5C5C54; margin:0 0 28px; max-width:44ch; }

  .field-label { display:block; font-family:Manrope, sans-serif; font-weight:600; font-size:11px;
                 letter-spacing:0.14em; text-transform:uppercase; color:#6A6A61; margin-bottom:8px; }
  .input { width:100%; max-width:380px; font-family:Manrope, sans-serif; font-size:16px; color:#0F0F0D;
           background:#FFFFFF; border:1px solid #C8C8BD; border-radius:2px; padding:14px 16px; }
  .input:focus-visible { outline:none; border-color:#0F0F0D; box-shadow:inset 0 -3px 0 #E8FF3A; }
  .input.code { font-family:Outfit, sans-serif; font-weight:700; font-size:26px; letter-spacing:0.5em;
                text-indent:0.5em; max-width:280px; text-align:center; }

  .btn { font-family:Manrope, sans-serif; font-weight:600; font-size:12px; letter-spacing:0.14em;
         text-transform:uppercase; background:#E8FF3A; color:#0A0A09; border:1px solid #E8FF3A;
         padding:15px 26px; border-radius:2px; cursor:pointer; transition:all .18s ease; }
  .btn:hover { background:#0A0A09; border-color:#0A0A09; color:#E8FF3A; }
  .btn[disabled] { opacity:0.45; cursor:default; }
  .btn-quiet { background:none; border:0; border-bottom:1px solid #C8C8BD; padding:0 0 4px;
               font-family:Manrope, sans-serif; font-weight:600; font-size:12px; letter-spacing:0.14em;
               text-transform:uppercase; color:#5C5C54; cursor:pointer; }
  .btn-quiet:hover { color:#0F0F0D; border-color:#5A6B00; }

  .msg { font-size:14px; line-height:1.5; margin:14px 0 0; max-width:44ch; }
  .msg.err { color:#A03A1E; }
  .msg.ok  { color:#5A6B00; }

  .chip { font-family:Manrope, sans-serif; font-weight:600; font-size:11px; letter-spacing:0.12em;
          text-transform:uppercase; border:1px solid #C8C8BD; background:#FFFFFF; color:#5C5C54;
          padding:9px 15px; cursor:pointer; transition:all .16s ease; }
  .chip:hover { border-color:#5A6B00; color:#5A6B00; }
  .chip[aria-pressed="true"] { border-color:#0F0F0D; background:#E8FF3A; color:#0A0A09; }

  .post { border:1px solid #E3E3DA; background:#FFFFFF; padding:24px 26px; margin-bottom:-1px; }
  .post-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .avatar { width:38px; height:38px; flex:0 0 38px; background:#F7F7F3; border:1px solid #DCDCD1;
            display:flex; align-items:center; justify-content:center; font-family:Outfit, sans-serif;
            font-weight:700; font-size:13px; color:#5A6B00; }
  .author { font-family:Outfit, sans-serif; font-weight:700; font-size:17px; text-transform:uppercase; }
  .when { font-family:Manrope, sans-serif; font-weight:600; font-size:11px; letter-spacing:0.1em;
          text-transform:uppercase; color:#8B8B80; margin-top:3px; }
  .body { font-size:16px; line-height:1.6; color:#2C2C27; margin:0 0 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .mention { color:#5A6B00; font-weight:600; }
  .post-img { display:block; width:100%; border:1px solid #E3E3DA; margin-bottom:14px; background:#F2F2EC; }
  .counts { display:flex; gap:20px; font-family:Manrope, sans-serif; font-weight:600; font-size:11px;
            letter-spacing:0.12em; text-transform:uppercase; color:#6A6A61; }
  .pill { font-family:Manrope, sans-serif; font-weight:600; font-size:10px; letter-spacing:0.14em;
          text-transform:uppercase; background:#E8FF3A; color:#0A0A09; padding:5px 10px; }

  .skel { border:1px solid #E3E3DA; background:#FFFFFF; padding:24px 26px; margin-bottom:-1px; }
  .skel div { background:#F2F2EC; height:12px; border-radius:2px; animation:pacr-pulse 1.3s ease-in-out infinite; }
  @keyframes pacr-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header class="pad-x" style="position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:16px 40px; background:rgba(255,255,255,0.85); backdrop-filter:blur(14px); border-bottom:1px solid #E3E3DA;">
  <a href="/" style="display:flex; align-items:center; gap:12px; color:inherit;">
    <img src="assets/pacr-mark.png" alt="PACR" width="34" height="34" style="width:34px; height:34px; border-radius:8px; display:block;">
    <span style="font-family:Outfit, sans-serif; font-weight:700; font-size:20px; letter-spacing:0.14em;">PACR</span>
  </a>
  <div id="authSlot"></div>
</header>

<main class="pad-x" style="max-width:760px; margin:0 auto; padding-top:64px; padding-bottom:96px;">

  <!-- Resolving the session. A signed-out visitor is redirected to /signin
       from here, so the feed itself never renders without one. -->
  <section id="paneBoot">
    <div class="eyebrow">Feed</div>
    <div class="skel"><div style="width:40%"></div></div>
  </section>

  <!-- Signed in. Signed-out visitors are sent to /signin before this renders. -->
  <section id="paneFeed" hidden>
    <div class="eyebrow">Feed</div>
    <h1 class="disp" id="feedTitle">Your feed</h1>
    <div id="squadChips" role="group" aria-label="Choose a squad"
         style="display:flex; flex-wrap:wrap; gap:8px; margin:0 0 32px;"></div>
    <div id="posts"></div>
    <p class="msg" id="feedMsg" hidden></p>
    <div style="margin-top:28px;">
      <button class="btn" id="moreBtn" type="button" hidden>Load more</button>
    </div>
    <p style="font-size:13.5px; color:#8B8B80; margin-top:48px; max-width:52ch;">
      This is a read-only view. Posting, liking, commenting and reporting all live in the app —
      <a href="/#get">open PACR</a> to join in.
    </p>
  </section>
</main>

<footer class="pad-x" style="border-top:1px solid #E3E3DA; padding:32px 40px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; font-family:Manrope, sans-serif; font-weight:600; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#8B8B80;">
  <span>© PACR</span>
  <span style="display:flex; gap:22px; flex-wrap:wrap;">
    <a href="/">Home</a>
    <a href="/privacy">Privacy</a>
    <a href="/support">Support</a>
  </span>
</footer>

<script type="module">
  import { initFeed } from '/js/feed.js';
  initFeed();
</script>
</body>
</html>
