<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pacr — Train like a craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600&family=Archivo:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="brand.css" />
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="#F4F1EC"/>
    <text x="200" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="120" letter-spacing="-5" fill="#0E0E0C">pacr</text>
    <line x1="135" y1="120" x2="160" y2="270" stroke="rgb(186,56,36)" stroke-width="6"/>
  </svg>
</template>

<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="page-home.jsx"></script>
<script type="text/babel" src="page-shop.jsx"></script>
<script type="text/babel" src="page-product.jsx"></script>
<script type="text/babel" src="page-cart.jsx"></script>
<script type="text/babel" src="page-about.jsx"></script>
<script type="text/babel" src="page-app.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function getPageFromHash(){
  const h = (location.hash || '').replace('#','');
  const valid = ['home','shop','product','cart','about','app'];
  return valid.includes(h) ? h : 'home';
}

function App(){
  const [page, setPage] = useState(getPageFromHash());

  useEffect(() => {
    const onHash = () => setPage(getPageFromHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const goto = (p) => {
    location.hash = p;
    setPage(p);
    window.scrollTo({top:0, behavior:'instant'});
  };

  const screenLabel = {
    home:'01 Home', shop:'02 Collection', product:'03 Product Detail',
    cart:'04 Cart', about:'05 Manifesto', app:'06 App / Membership'
  }[page];

  return (
    <PageContext.Provider value={{page, goto}}>
      <div data-screen-label={screenLabel}>
        <Nav page={page} goto={goto}/>
        <main>
          {page === 'home' && <HomePage/>}
          {page === 'shop' && <ShopPage/>}
          {page === 'product' && <ProductPage/>}
          {page === 'cart' && <CartPage/>}
          {page === 'about' && <AboutPage/>}
          {page === 'app' && <AppPage/>}
        </main>
        <Footer goto={goto}/>
      </div>
    </PageContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
