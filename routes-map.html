<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F5F5EF; }
  #map { position:absolute; inset:0; background:#F5F5EF; }
  .leaflet-container { font-family:Manrope, Helvetica, sans-serif; background:#F5F5EF; }
  .leaflet-control-attribution { font-size:9px; letter-spacing:0.02em; background:rgba(255,255,255,0.86); }
  .pacr-tip { font-family:Manrope, Helvetica, sans-serif; font-weight:600; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map', { zoomControl: true, scrollWheelZoom: false, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);

  var routes = [
    { name: 'Marine Loop · 6.2 km', primary: true, coords: [
      [13.05580,80.28270],[13.05180,80.28320],[13.04740,80.28350],[13.04300,80.28320],[13.03860,80.28260],[13.03480,80.28150],[13.03120,80.27980],[13.03260,80.27760],[13.03700,80.27860],[13.04180,80.27950],[13.04680,80.28010],[13.05180,80.28070],[13.05580,80.28270]
    ] },
    { name: 'Banyan Cut · 4.1 km', coords: [
      [13.01120,80.25520],[13.01000,80.25760],[13.00820,80.25960],[13.00600,80.26060],[13.00420,80.25900],[13.00500,80.25640],[13.00760,80.25460],[13.01120,80.25520]
    ] },
    { name: 'Reservoir Ridge · 9.8 km', coords: [
      [13.02120,80.24020],[13.02460,80.24280],[13.02760,80.24640],[13.03060,80.25060],[13.03420,80.25420],[13.03840,80.25620],[13.04260,80.25680]
    ] },
    { name: 'Stadium Straight · 1.6 km', coords: [
      [13.06340,80.27180],[13.06420,80.27400],[13.06280,80.27520],[13.06160,80.27320],[13.06340,80.27180]
    ] }
  ];

  var all = [];
  routes.forEach(function (r) {
    all = all.concat(r.coords);
    if (r.primary) {
      L.polyline(r.coords, { color: '#0F0F0D', weight: 10, opacity: 0.14, lineCap: 'round' }).addTo(map);
      L.polyline(r.coords, { color: '#E8FF3A', weight: 6, opacity: 1, lineCap: 'round' }).addTo(map)
        .bindTooltip(r.name, { className: 'pacr-tip', direction: 'top' });
      L.circleMarker(r.coords[0], { radius: 6, color: '#0F0F0D', weight: 3, fillColor: '#E8FF3A', fillOpacity: 1 }).addTo(map);
    } else {
      L.polyline(r.coords, { color: '#0F0F0D', weight: 4, opacity: 0.45, dashArray: '9 8', lineCap: 'round' }).addTo(map)
        .bindTooltip(r.name, { className: 'pacr-tip', direction: 'top' });
    }
  });

  map.fitBounds(L.latLngBounds(all).pad(0.12));
</script>
</body>
</html>
