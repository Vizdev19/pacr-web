<style>
  /* Link-in-bio page. Standalone by design: no site nav, no site stylesheet. */
  html, body { margin: 0; padding: 0; background: #d8d66a; -webkit-text-size-adjust: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
  a { color: #16150f; text-decoration: none; }
  a:hover { color: oklch(0.62 0.19 40); }

  .page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: linear-gradient(225deg, #e5df3a 0%, #d8d66d 35%, #d2d48f 65%, #c3c9d2 100%);
    font-family: 'Archivo', Helvetica, sans-serif;
    color: #16150f;
  }

  .shell {
    width: 100%;
    max-width: 480px;
    padding: calc(env(safe-area-inset-top) + 48px) 20px calc(env(safe-area-inset-bottom) + 24px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .id { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .id img {
    width: clamp(88px, 26vw, 112px);
    height: clamp(88px, 26vw, 112px);
    border-radius: 50%;
    object-fit: cover;
  }
  .id h1 {
    margin: 8px 0 0;
    font-size: clamp(28px, 8vw, 34px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .id p { margin: 0; font-size: 16px; color: #5b5850; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 58px;
    box-sizing: border-box;
    padding: 16px 20px;
    border-radius: 14px;
    background: #a6a3a1;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    transition: transform .15s;
  }
  .link:hover { transform: translateY(-2px); background: #a6a3a1; color: #ffffff; }
  .link span { display: flex; align-items: center; gap: 12px; }
  .link .arrow { font-size: 20px; }

  .socials { width: 100%; max-width: 320px; display: flex; justify-content: space-between; }
  .socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    color: #ffffff;
    font-size: 28px;
    transition: transform .15s;
  }
  .socials a:hover { transform: scale(1.12); color: #ffffff; }

  .credit {
    margin: auto 0 0;
    padding-top: 24px;
    font-size: 12px;
    color: #8a867c;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>

<div class="page">
